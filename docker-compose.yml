version: '3.8'

services:
  # The Automation Brain
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_data_agent
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BLOCK_RESOURCES=false
      - N8N_ENCRYPTION_KEY=hp_elite_secure_123
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - n8n_data:/home/node/.n8n
      # This maps your Windows folder to the container
      - .:/data/project
    networks:
      - ai_net

  # The AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  n8n_data:
  ollama_data: